name: CI

on:
    pull_request:
    push:
        branches: [main, develop]

# Least privilege: CI only needs to read the code.
permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # Actions are pinned to commit SHAs (not tags) so a moved tag cannot inject code.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: npm

            # Installs the tools pinned in rokit.toml (rojo, lune).
            - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
              with:
                  version: v1.2.0
                  cache: true

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Validate Rojo project
              run: rojo build default.project.json -o "$RUNNER_TEMP/game.rbxl"

            - name: Audit dependencies
              run: npm audit --audit-level=moderate
